name: Keep Workflows Active

# ─────────────────────────────────────────────────────────────────────────────
# PURPOSE: Prevents GitHub's 60-day inactivity auto-disable from killing
#          the NSE_BSE_Daily_Pipeline schedule.
#
# HOW IT WORKS (v2 — fixed logic):
#   GitHub's inactivity clock counts COMMITS, not workflow runs.
#   The daily pipeline running 253 times does NOT reset the clock.
#   Only an actual git commit/push does.
#
#   This workflow ALWAYS pushes a keep-alive commit every run to reset
#   the 60-day inactivity clock. Additionally, it checks if the main
#   pipeline has been silent for 7+ days and alerts if so.
#
#   v1 BUG: the commit was inside the "pipeline unhealthy" branch,
#   so it never committed when the pipeline was running fine. The
#   inactivity clock was never reset despite keep_alive running.
#   v2 FIX: commit always runs first, check runs after.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 10 * * 3'   # Wednesday 10:00 UTC
    - cron: '0 10 * * 0'   # Sunday    10:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions:  write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      # ── STEP 1: ALWAYS commit (resets GitHub's 60-day inactivity clock) ──
      # This must happen every run regardless of pipeline health.
      # GitHub only counts commits as "activity" — workflow runs do NOT count.
      - name: Commit keep-alive timestamp (always runs)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Last keep-alive: $TIMESTAMP" > .github/last_active.txt

          git add .github/last_active.txt
          git diff --staged --quiet && echo "No changes to commit (file unchanged)" && exit 0

          git commit -m "chore: keep-alive ping [$TIMESTAMP]"
          git push
          echo "✅ Keep-alive commit pushed — 60-day inactivity clock reset"

      # ── STEP 2: Check if main pipeline has been silent for 7+ days ──
      # This is a health check only — it doesn't affect the commit above.
      - name: Check if NSE_BSE_Daily_Pipeline ran in the last 7 days
        id: check_pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
        run: |
          LAST_RUN=$(gh api \
            "repos/${REPO}/actions/workflows/market_run.yml/runs?per_page=1&status=completed" \
            --jq '.workflow_runs[0].created_at' 2>/dev/null || echo "")

          if [ -z "$LAST_RUN" ] || [ "$LAST_RUN" = "null" ]; then
            echo "⚠️  No completed runs found for market_run.yml"
            echo "pipeline_healthy=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Last completed pipeline run: $LAST_RUN"

          LAST_EPOCH=$(python3 -c "
          from datetime import datetime
          print(int(datetime.fromisoformat('${LAST_RUN}'.replace('Z','+00:00')).timestamp()))
          ")
          NOW_EPOCH=$(date +%s)
          DAYS_SINCE=$(( (NOW_EPOCH - LAST_EPOCH) / 86400 ))
          echo "Days since last pipeline run: $DAYS_SINCE"

          if [ "$DAYS_SINCE" -lt 7 ]; then
            echo "✅ Pipeline ran $DAYS_SINCE day(s) ago — healthy."
            echo "pipeline_healthy=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Pipeline silent for $DAYS_SINCE days — threshold exceeded."
            echo "pipeline_healthy=false" >> $GITHUB_OUTPUT
          fi

      # ── STEP 3: Re-enable pipeline only if it was disabled ──
      - name: Re-enable NSE_BSE_Daily_Pipeline if disabled
        if: steps.check_pipeline.outputs.pipeline_healthy == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO:     ${{ github.repository }}
        run: |
          STATE=$(gh api \
            "repos/${REPO}/actions/workflows/market_run.yml" \
            --jq '.state' 2>/dev/null || echo "unknown")

          echo "market_run.yml state: $STATE"

          if [ "$STATE" = "disabled_inactivity" ] || [ "$STATE" = "disabled_manually" ]; then
            echo "⚠️  Pipeline is DISABLED — re-enabling now..."
            gh api --method PUT \
              "repos/${REPO}/actions/workflows/market_run.yml/enable"
            echo "✅ market_run.yml re-enabled"
          else
            echo "Pipeline is $STATE — already enabled."
          fi

      # ── STEP 4: Alert loudly if pipeline is unhealthy (sends GitHub email) ──
      - name: Alert — pipeline has been silent for 7+ days
        if: steps.check_pipeline.outputs.pipeline_healthy == 'false'
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  ⚠️  ALERT: NSE_BSE_Daily_Pipeline has not run for 7+ days"
          echo "  Check the Actions tab to investigate."
          echo "════════════════════════════════════════════════════════════"
          exit 1