name: One-Off DB Restore

# ─────────────────────────────────────────────────────────────────────────────
# MANUAL-ONLY workflow to push a known-good market_data.db into the
# `market-data-db` artifact, without touching market_run.yml.
#
# Use: you fixed the false KOVAI row in your LOCAL market_data.db and need
# that corrected DB to become the live artifact so the next scheduled
# NSE_BSE_Daily_Pipeline run downloads the GOOD copy.
#
# This workflow does NOT run the pipeline. It only:
#   1. Checks out the branch (which temporarily contains the committed DB)
#   2. Deletes the existing market-data-db artifact(s)
#   3. Uploads the committed market_data.db as the new artifact
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:   # manual trigger only — never automatic

permissions:
  contents: read
  actions: write       # needed to delete old artifacts

jobs:
  restore-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify committed market_data.db exists
        run: |
          if [ ! -f market_data.db ]; then
            echo "❌ market_data.db not found in the repo."
            echo "   You must commit the fixed DB to this branch first."
            exit 1
          fi
          SIZE=$(du -sh market_data.db | cut -f1)
          echo "✅ Found committed market_data.db — size: $SIZE"

      - name: Confirm KOVAI is OPEN in the committed DB
        run: |
          python3 - << 'PYEOF'
          import sqlite3
          c = sqlite3.connect("market_data.db")
          rows = c.execute(
              "SELECT recommendation_date, symbol, outcome_type, "
              "outcome_price, current_pnl_pct "
              "FROM gold_outcomes WHERE symbol='KOVAI'"
          ).fetchall()
          print("KOVAI rows:", rows)
          bad = [r for r in rows if r[2] == "SL_HIT"
                 and abs((r[3] or 0)) > 0 and -0.5 <= (r[4] or 0) <= 0.5]
          if bad:
              print("❌ A false SL_HIT KOVAI row is still present:", bad)
              raise SystemExit(1)
          print("✅ No false KOVAI SL_HIT row — DB is clean, safe to upload.")
          c.close()
          PYEOF

      - name: Delete previous DB artifact(s)
        run: |
          echo "Listing existing artifacts named 'market-data-db'..."
          ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=market-data-db&per_page=100")
          IDS=$(echo "$ARTIFACTS" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print('\n'.join(str(a['id']) for a in data.get('artifacts', [])))
          ")
          if [ -z "$IDS" ]; then
            echo "No existing artifacts found — nothing to delete."
          else
            for ID in $IDS; do
              echo "Deleting artifact ID: $ID"
              curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ID"
            done
            echo "✅ Old artifact(s) deleted"
          fi

      - name: Upload corrected market_data.db as artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-data-db
          path: market_data.db
          retention-days: 30
          overwrite: true

      - name: Done
        run: |
          echo "✅ Corrected market_data.db uploaded as 'market-data-db' artifact."
          echo "   The next NSE_BSE_Daily_Pipeline run will download THIS copy."
          echo "   REMINDER: revert the .gitignore change + remove the DB from git now."