name: NSE_BSE_Daily_Pipeline

on:
  schedule:
    - cron: '30 13 * * 1-5' # 19:00 IST
  workflow_dispatch:

permissions:
  contents: write # REQUIRED: Allows the bot to push the DB back

jobs:
  run-analyser:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas openpyxl requests google-generativeai twilio pytz flask python-dotenv

      - name: Execute Master Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python master_funnel.py

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add market_data.db
          # Only commits if the DB actually changed
          git commit -m "Automated DB Update (Circular Queue): $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push