name: NSE_BSE_Daily_Pipeline

on:
  schedule:
    - cron: '0 23 * * 1-5'   # 23:00 UTC = 04:30 IST next day (Tue–Sat IST)
  workflow_dispatch:
    inputs:
      reset_performance:
        description: >-
          DANGER - type RESET-PERFORMANCE to wipe gold_recommendations,
          gold_outcomes and gold_continuation. IRREVERSIBLE. Leave blank
          for a normal run.
        required: false
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  run-analyser:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── v17.12: per-day AI card cache across runs ─────────────────────────
      # Each Actions run is a fresh VM, so downloads/ai_cache/ written by one
      # run vanishes before the next — the same-day re-run cache never hit and
      # every re-run re-billed the LLM. actions/cache restores the latest
      # cache at job start and saves it at job end automatically.
      #   key          — unique per run, so every run SAVES its (possibly
      #                  updated) cache; actions/cache never overwrites a hit key
      #   restore-keys — prefix match restores the most recent cache from
      #                  ANY prior run. Same-day files are then served; the
      #                  Python layer purges any older-dated files itself.
      # AI_CACHE=0 (repo variable) bypasses without touching this step.
      - name: Restore AI card cache (v17.12)
        uses: actions/cache@v4
        with:
          path: downloads/ai_cache
          key: ai-cache-${{ github.run_id }}
          restore-keys: |
            ai-cache-

      - name: Restore market_data.db from artifact
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          name: market-data-db
          path: .
          if_no_artifact_found: ignore

      - name: Show DB state before pipeline
        run: |
          if [ -f market_data.db ]; then
            SIZE=$(du -sh market_data.db | cut -f1)
            echo "Restored market_data.db - size: $SIZE"
          else
            echo "No existing DB found - pipeline will create fresh DB"
          fi

      - name: Auto-backfill if DB is fresh
        run: |
          ROWS=$(python3 -c "import sqlite3,os; c=sqlite3.connect('market_data.db') if os.path.exists('market_data.db') else None; print(c.execute('SELECT COUNT(*) FROM daily_prices').fetchone()[0] if c else 0)" 2>/dev/null || echo 0)
          echo "daily_prices rows: $ROWS"
          if [ "$ROWS" -lt "50000" ]; then
            echo "Fresh DB - running 400-day backfill to build history (v12.6.1+)..."
            # v12.6.1: bumped 365 → 400 to give R2/S2 rolling-252 window headroom.
            # Matches DAYS_TO_BACKFILL default in backfill_history.py:55.
            python3 backfill_history.py 400 || echo "Backfill completed (some dates may have failed - normal on cloud runners)"
          else
            echo "Sufficient history ($ROWS rows) - skipping backfill"
          fi

      # v17.17: the "v12.1 self-healing diagnostic" and "v16.5 false-KOVAI
      # cleanup" steps were removed. The first deleted the dual-listed
      # allowlist every run (stale 700-row limit); protection now lives at
      # write time in ingestion/allowlist_maintainer.py. The second was a
      # one-time repair with nothing left to repair.

      - name: v17.3 ONE-SHOT performance reset (manual dispatch only)
        # ---------------------------------------------------------------
        # Wipes gold_recommendations / gold_outcomes / gold_continuation so
        # performance measurement restarts under current logic (v17.1
        # horizon-key fix, v17.0 SL + trailing recalibration, v17.0 entry
        # gates, v17.3 continuation). The 31 closed positions were measured
        # under three incompatible rule sets, so their aggregate hit rate
        # was not a meaningful number.
        #
        # CANNOT FIRE ON THE CRON. `schedule` supplies no inputs, so
        # github.event.inputs.reset_performance is empty on every scheduled
        # run and this step is skipped. It executes only when a human
        # dispatches the workflow manually AND types the exact phrase.
        #
        # Runs BEFORE the pipeline so the same run repopulates from zero.
        # IRREVERSIBLE: market_data.db exists only as a 30-day artifact.
        # ---------------------------------------------------------------
        if: github.event.inputs.reset_performance == 'RESET-PERFORMANCE'
        run: |
          if [ ! -f market_data.db ]; then
            echo "::error::No DB restored from artifact - refusing to reset."
            exit 1
          fi
          echo "Dry run first - audit trail of what is about to be deleted:"
          python3 reset_performance_tracking.py
          echo ""
          echo "Executing reset..."
          python3 reset_performance_tracking.py --commit --confirm RESET-PERFORMANCE

      - name: Execute Master Pipeline
        env:
          # v17.9: news/catalyst sentiment via company OpenAI-compatible LLM (Sonnet)
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE:       ${{ secrets.OPENAI_API_BASE }}
          LLM_MODEL:             ${{ secrets.LLM_MODEL }}
          NEWS_SENTIMENT_SHADOW: ${{ vars.NEWS_SENTIMENT_SHADOW }}
          AI_CACHE:              ${{ vars.AI_CACHE }}   # v17.12: unset/1 = cache on, 0 = bypass
          SENDER_EMAIL:          ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD:   ${{ secrets.SENDER_APP_PASSWORD }}
          USER_EMAIL_ID:         ${{ secrets.USER_EMAIL_ID }}
          TWILIO_ACCOUNT_SID:    ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:     ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python master_funnel.py || true

      # Delete old artifact via GitHub REST API — no external action needed.
      # Uses the built-in GITHUB_TOKEN (actions: write permission already set above).
      # Lists all artifacts named 'market-data-db' and deletes each one before upload.
      # This keeps storage at ~443 MB (1 copy only) instead of accumulating every run.
      - name: Delete previous DB artifact to free storage quota
        run: |
          echo "Listing existing artifacts named 'market-data-db'..."
          ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=market-data-db&per_page=100")
          IDS=$(echo "$ARTIFACTS" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          ids = [str(a['id']) for a in data.get('artifacts', [])]
          print('\n'.join(ids))
          ")
          if [ -z "$IDS" ]; then
            echo "No existing artifacts found — skipping delete (first run)"
          else
            for ID in $IDS; do
              echo "Deleting artifact ID: $ID"
              curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ID"
            done
            echo "✅ Old artifacts deleted"
          fi

      - name: Save market_data.db as artifact
        if: hashFiles('market_data.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: market-data-db
          path: market_data.db
          retention-days: 30
          overwrite: true

      - name: Show DB state after pipeline
        if: always()
        run: |
          if [ -f market_data.db ]; then
            SIZE=$(du -sh market_data.db | cut -f1)
            echo "DB size: $SIZE"
            python3 -c "import sqlite3; c=sqlite3.connect('market_data.db'); r=c.execute('SELECT COUNT(*),MIN(date),MAX(date) FROM daily_prices').fetchone(); print(f'Rows: {r[0]:,} | Range: {r[1]} to {r[2]}'); c.close()" 2>/dev/null || echo "DB stats not available yet"
          else
            echo "No market_data.db present after pipeline run"
          fi