name: NSE_BSE_Daily_Pipeline

on:
  schedule:
    # Runs at 13:30 UTC, which is 19:00 IST every Mon-Fri 
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  run-analyser:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # This removes the warning
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests google-generativeai twilio pytz flask python-dotenv

      - name: Execute Master Pipeline
        env:
          # Add your API keys/Tokens in GitHub Settings > Secrets
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python master_funnel.py