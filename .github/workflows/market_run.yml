name: NSE_BSE_Daily_Pipeline

on:
  schedule:
    # 14:00 UTC = 19:30 IST (Mon-Fri)
    - cron: '0 14 * * 1-5'
  workflow_dispatch: # Allows manual trigger for testing..

permissions:
  contents: write # REQUIRED: Allows the bot to push the DB back

jobs:
  run-analyser:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        # run: pip install pandas openpyxl requests google-generativeai twilio pytz flask python-dotenv curl_cffi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      

      - name: Execute Master Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          USER_EMAIL_ID: ${{ secrets.USER_EMAIL_ID }}
        run: python master_funnel.py || true
        # We use "|| true" to ensure the DB Commit step still runs 
        # to log the "Skip" reason even if the gatekeeper halts.

      - name: Commit and Push Updated Database
        # This "if" condition ensures we only try to push if a DB exists
        if: hashFiles('market_data.db') != ''
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add market_data.db
          # Only commits if the DB actually changed
          git commit -m "Automated DB Update (Circular Queue): $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push