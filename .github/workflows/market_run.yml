name: NSE_BSE_Daily_Pipeline

on:
  schedule:
    # 01:30 UTC = 07:00 IST  (next morning after market close)
    # This gives 12+ hours after NSE/BSE publish Bhav Copy (~18:00 IST previous day)
    # Gate check inside orchestrator.py confirms files are available before proceeding..
    - cron: '30 1 * * 2-6'   # Tue–Sat UTC = Mon–Fri IST
  workflow_dispatch:           # Manual trigger for testing

permissions:
  contents: write              # Required: allows bot to commit DB back

jobs:
  run-analyser:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Master Pipeline
        env:
          # ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL:          ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD:   ${{ secrets.SENDER_APP_PASSWORD }}
          USER_EMAIL_ID:         ${{ secrets.USER_EMAIL_ID }}
          TWILIO_ACCOUNT_SID:    ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:     ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python master_funnel.py || true
        # "|| true" ensures the DB commit step runs even if pipeline is skipped/errored

      - name: Commit and Push Updated Database
        if: hashFiles('market_data.db') != ''
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add market_data.db
          git commit -m "Automated DB Update: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No DB changes to commit"
          git push
