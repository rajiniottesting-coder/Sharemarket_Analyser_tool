name: NSE_BSE_Daily_Pipeline

on:
  schedule:
    - cron: '30 0 * * 2-6'   # Tue-Sat UTC = Mon-Fri IST (06:00 IST)
  workflow_dispatch:           # Manual trigger for testing

permissions:
  contents: read               # read repo code
  actions: read                # needed to download artifacts from previous runs

jobs:
  run-analyser:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore market_data.db from artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: market-data-db
          path: .
          if_no_artifact_found: ignore
          workflow_conclusion: ""

      - name: Show DB state before pipeline
        run: |
          if [ -f market_data.db ]; then
            SIZE=$(du -sh market_data.db | cut -f1)
            echo "Restored market_data.db — size: $SIZE"
          else
            echo "No existing DB found — pipeline will create fresh DB"
          fi

      - name: Backfill if DB is missing or has less than 30 days of history
        # On a fresh runner (no artifact restored) or after DB loss,
        # run a 90-day backfill so Stage 1-3 filters have volume/delivery history.
        # On normal daily runs the artifact provides 365 days — this step is skipped.
        run: |
          python3 - <<'PYEOF'
          import sqlite3, os, sys
          if not os.path.exists('market_data.db'):
              print("No DB — need backfill"); sys.exit(1)
          try:
              c = sqlite3.connect('market_data.db')
              days = c.execute("SELECT COUNT(DISTINCT date) FROM daily_prices").fetchone()[0]
              c.close()
              print(f"DB has {days} days")
              sys.exit(0 if days >= 30 else 1)
          except Exception as e:
              print(f"DB check failed: {e}"); sys.exit(1)
          PYEOF
          if [ $? -ne 0 ]; then
            echo "Running 90-day backfill to seed history..."
            python backfill_history.py 90
          else
            echo "DB has sufficient history — skipping backfill"
          fi

      - name: Execute Master Pipeline
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          SENDER_EMAIL:          ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD:   ${{ secrets.SENDER_APP_PASSWORD }}
          USER_EMAIL_ID:         ${{ secrets.USER_EMAIL_ID }}
          TWILIO_ACCOUNT_SID:    ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:     ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python master_funnel.py || true

      - name: Save market_data.db as artifact
        if: hashFiles('market_data.db') != ''
        uses: actions/upload-artifact@v4
        with:
          name: market-data-db
          path: market_data.db
          retention-days: 7
          overwrite: true

      - name: Show DB state after pipeline
        if: always()
        run: |
          if [ -f market_data.db ]; then
            SIZE=$(du -sh market_data.db | cut -f1)
            python3 - <<'PYEOF'
          import sqlite3, sys
          try:
              c = sqlite3.connect('market_data.db')
              r = c.execute('SELECT COUNT(*), MIN(date), MAX(date) FROM daily_prices').fetchone()
              print(f"DB rows: {r[0]:,} | Date range: {r[1]} to {r[2]}")
              c.close()
          except Exception as e:
              print(f"DB not readable: {e}")
          sys.exit(0)
          PYEOF
          fi